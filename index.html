<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pushpak Viman and Jatayu</title>
    <style>
        body { margin: 0; padding: 0; width: 1080px; height: 1920px; background: #87CEEB; overflow: hidden; }
        .clip { position: absolute; width: 1080px; height: 1920px; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="scene" class="clip" data-start="0" data-duration="5">
        <canvas id="stage" width="1080" height="1920"></canvas>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        window.__timelines["main"] = tl;

        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');

        function drawViman(x, y, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            // Boat body (Golden)
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(-150, 0, 300, 100);
            // Swan-neck prow
            ctx.beginPath();
            ctx.moveTo(-150, 0);
            ctx.quadraticCurveTo(-250, -50, -200, -100);
            ctx.stroke();
            // Three-tier Shikhara
            ctx.fillStyle = '#DAA520';
            ctx.fillRect(-50, -100, 100, 100);
            ctx.fillRect(-30, -150, 60, 50);
            ctx.fillRect(-15, -180, 30, 30);
            // Kalash
            ctx.fillStyle = '#FF4500';
            ctx.beginPath();
            ctx.arc(0, -195, 15, 0, Math.PI * 2);
            ctx.fill();
            // Flag
            ctx.fillStyle = '#FF8C00';
            ctx.fillRect(15, -210, 40, 20);
            ctx.restore();
        }

        function drawJatayu(x, y, frame) {
            ctx.fillStyle = '#8B4513'; // Feathers
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2); // Body
            ctx.fill();
            ctx.fillStyle = '#FFC0CB'; // Pink head
            ctx.beginPath();
            ctx.arc(x+10, y-30, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        // Render loop logic driven by GSAP timeline
        tl.to({ time: 0 }, {
            duration: 5,
            onUpdate: function() {
                const t = this.progress() * 5;
                ctx.clearRect(0, 0, 1080, 1920);

                // Clouds
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 1500, 1080, 420);

                // Viman
                drawViman(540, 1400, 0);

                // Jatayu logic
                let jx = 900 - (t * 200);
                let jy = 200 + (t * 300);
                if (t >= 1.7 && t < 2.0) {
                    jx = 500; jy = 1200; // Strike position
                } else if (t >= 2.0) {
                    jx = 400 + (t * 100); jy = 1300 - (t * 200);
                }
                drawJatayu(jx, jy, t);
            }
        });
    </script>
</body>
</html>
